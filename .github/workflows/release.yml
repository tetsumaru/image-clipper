name: Release Alfred Workflow

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "リリースバージョン（例: v1.0.1）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::バージョン形式が不正です。'v1.0.0' のような形式で指定してください。"
            exit 1
          fi

      - name: Set tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.tag.outputs.name }}"
          git push origin "${{ steps.tag.outputs.name }}"

      - name: Build .alfredworkflow
        run: |
          cd workflow
          zip -r "../Image-Clipper.alfredworkflow" . -x ".*"

      - name: Create GitHub Release
        run: |
          gh release create "${{ steps.tag.outputs.name }}" \
            --title "Image Clipper ${{ steps.tag.outputs.name }}" \
            --generate-notes \
            "Image-Clipper.alfredworkflow#Image-Clipper.alfredworkflow"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
